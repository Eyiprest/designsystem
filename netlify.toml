[build]
  command = "npm run build:site"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Storybook's entry files must be re-checked on every visit, because the
# hashed files in /assets/ get new names on each deploy. Without this, a
# browser can hold an old index and ask for files that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/iframe.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/checkout/index.html"
  [headers.values]
    Cache-Control = "no-cache"
